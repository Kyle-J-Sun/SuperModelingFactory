name: Verify source package

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request cancels its own older run when it gets a new push; every other
# run gets a group of its own, so each commit is verified and none is cancelled
# by a later one.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_package:
    name: Python source package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q Modeling_Tool ExcelMaster Report

      - name: Check packaging metadata
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
